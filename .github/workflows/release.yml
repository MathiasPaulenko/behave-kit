name: Release

# Fully automatic release pipeline.
#
# Trigger:
#   - When a tag matching `v*` is pushed.
#   - Manual via the "Run workflow" button.
#
# Behaviour:
#   1. Reads the version from `pyproject.toml`.
#   2. Verifies the tag matches the version.
#   3. Builds sdist + wheel, publishes to PyPI via Trusted Publishing,
#      and creates a GitHub Release with auto-generated notes.
#
# To cut a new release: bump `version` in pyproject.toml, commit, push,
# then `git tag v1.4.0 && git push origin v1.4.0`. Done.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------
  # Verify the tag matches the version in pyproject.toml.
  # ----------------------------------------------------------------------
  verify:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: read
        name: Read version from pyproject.toml
        run: |
          VERSION=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      - name: Verify tag matches version
        run: |
          VERSION="${{ steps.read.outputs.version }}"
          TAG="${GITHUB_REF_NAME:-manual}"
          EXPECTED_TAG="v$VERSION"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag $TAG does not match version $EXPECTED_TAG"
            exit 1
          fi
          echo "Tag $TAG matches version $VERSION"

  # ----------------------------------------------------------------------
  # Build the distribution artifacts.
  # ----------------------------------------------------------------------
  build:
    name: Build distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ----------------------------------------------------------------------
  # Publish to PyPI via OIDC Trusted Publishing (no tokens).
  # ----------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/behave-kit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
        continue-on-error: true

  # ----------------------------------------------------------------------
  # Create the GitHub Release with auto-generated notes.
  # ----------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ${{ needs.verify.outputs.tag }}
          generate_release_notes: true
          files: dist/*
